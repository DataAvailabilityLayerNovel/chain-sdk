---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions: {}
jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/test.yml
    secrets: inherit

  proto:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/proto.yml
